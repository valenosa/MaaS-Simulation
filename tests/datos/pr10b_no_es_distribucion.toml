# PR-10 (b): 'describe' existe en scipy.stats, pero no es una distribución (SDD §12.2).

[catalogo]
version = "PRUEBA"

[TB]
tipo = "scipy"
familia = "describe"
parametros = {}

[D]
tipo = "scipy"
familia = "lognorm"
parametros = { s = 0.5, scale = 2.718281828459045, loc = 0 }

[DEM]
tipo = "scipy"
familia = "expon"
parametros = { scale = 0.8 }

[TAR]
modo = "independiente"
tipo = "scipy"
familia = "uniform"
parametros = { loc = 5, scale = 20 }
