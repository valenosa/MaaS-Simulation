# PR-10 (c): los datos de PR-06 con búsqueda constante -1, con NCH = 1 (SDD §12.2).
# v = 60 mi/h: el tiempo de viaje en minutos es igual a la distancia en millas.
# Las claves que la prueba no menciona toman los valores de config/experimento.toml (SDD §12.1).

[modelo]
velocidad_mph = 60
umbral_tolerancia_min = 2
horizonte_min = 30

[demanda]
media_ia_base_min = 2.5
niveles = { bajo = 0.7, base = 1.0, alto = 1.3 }

[experimento]
replicas = 30
semilla_base = 20261002
catalogo_fdp = "pr10c_catalogo.toml"
rango_margen_inferior = 2
rango_margen_superior = 6
rango_manual = []
verificar_invariantes = true

[analisis]
espera_total_max_min = 10
abandono_max_pct = 5
nivel_confianza = 0.95
